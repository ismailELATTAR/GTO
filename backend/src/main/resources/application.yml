spring:
  application:
    name: pokergto-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokergto}
    username: ${DB_USERNAME:pokergto}
    password: ${DB_PASSWORD:pokergto}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring auto-fetches Keycloak's public signing keys from this
          # realm's JWKS endpoint (issuer-uri + "/protocol/openid-connect/certs")
          # and validates every incoming access token's signature against them.
          issuer-uri: ${KEYCLOAK_BASE_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:pokergto}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:pokergto}
    client-id: ${KEYCLOAK_CLIENT_ID:pokergto-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:dev-client-secret-change-me}

<div class="min-h-dvh bg-surface-950 px-4 py-8 text-white sm:px-6">
  <div class="mx-auto max-w-2xl">
    @if (lesson(); as l) {
      <button type="button" (click)="goBack()" class="text-sm text-white/50 hover:text-white">← Back</button>

      <article
        class="prose prose-invert mt-4 max-w-none prose-headings:font-display prose-a:text-accent-400"
        [innerHTML]="renderedContent()"
      ></article>

      @if (l.topics.length > 0) {
        <div class="mt-8 flex flex-wrap gap-2 border-t border-white/10 pt-6">
          @for (topic of l.topics; track topic) {
            <span class="rounded-full bg-surface-800 px-3 py-1 text-xs text-white/60">{{ topic }}</span>
          }
        </div>
      }
    }
  </div>
</div>

<div
  class="min-h-dvh px-4 py-6 sm:px-6"
  style="background: radial-gradient(120% 90% at 50% -10%, var(--color-felt-700) 0%, var(--color-felt-900) 55%, var(--color-felt-950) 100%);"
>
  <header class="mx-auto flex max-w-2xl items-center justify-between">
    <span class="font-display text-sm font-semibold tracking-wide text-white/70">♠ PokerGTO</span>
    <button
      type="button"
      (click)="logout()"
      class="rounded-full border border-white/15 px-3 py-1.5 text-xs text-white/70 transition hover:border-white/30 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent-400"
    >
      Log out
    </button>
  </header>

  @if (user(); as u) {
    <main class="mx-auto mt-8 max-w-2xl rounded-t-[2.5rem] rounded-b-2xl bg-surface-900 px-6 pb-8 pt-10 shadow-2xl sm:mt-14 sm:px-10">
      <h1 class="font-display text-3xl font-bold text-white sm:text-4xl">
        {{ timeOfDayGreeting() }}, {{ u.displayName }}.
      </h1>
      <p class="mt-2 text-white/60">Your seat's open.</p>

      <div class="mt-10 grid grid-cols-3 gap-4 rounded-2xl bg-surface-800/60 px-4 py-6">
        <app-chip-stack label="Level" [value]="stats.level.value" [active]="stats.level.active" />
        <app-chip-stack label="Accuracy" [value]="stats.accuracy.value" [active]="stats.accuracy.active" />
        <app-chip-stack label="Streak" [value]="stats.streak.value" [active]="stats.streak.active" />
      </div>

      <a
        routerLink="/practice"
        class="mt-8 flex items-center justify-center gap-2 rounded-xl bg-accent-500 py-4 text-base font-semibold text-surface-950 transition hover:bg-accent-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-400"
      >
        Start training
      </a>

      <a
        routerLink="/curriculum"
        class="mt-3 flex items-center justify-center gap-2 rounded-xl border border-white/10 py-3 text-sm font-medium text-white/70 transition hover:border-white/20 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-400"
      >
        Browse lessons
      </a>

      <p class="mt-4 text-center text-sm text-white/40">
        Play your first hand to start building your stack.
      </p>
    </main>
  }
</div>

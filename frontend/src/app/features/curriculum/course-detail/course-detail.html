<div class="min-h-dvh bg-surface-950 px-4 py-8 text-white sm:px-6">
  <div class="mx-auto max-w-2xl">
    @if (course(); as c) {
      <a routerLink="/curriculum" class="text-sm text-white/50 hover:text-white">← Curriculum</a>
      <h1 class="mt-2 font-display text-2xl text-accent-400">{{ c.title }}</h1>
      @if (c.description) {
        <p class="mt-2 text-white/60">{{ c.description }}</p>
      }

      <div class="mt-6 space-y-3">
        @for (module of c.modules; track module.id) {
          <a
            [routerLink]="['/modules', module.id]"
            class="block rounded-xl bg-surface-900 p-5 transition hover:bg-surface-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent-400"
          >
            <h2 class="font-display text-lg font-semibold">{{ module.title }}</h2>
            @if (module.description) {
              <p class="mt-1 text-sm text-white/60">{{ module.description }}</p>
            }
          </a>
        }
      </div>
    }
  </div>
</div>

<div class="min-h-dvh bg-surface-950 px-4 py-8 text-white sm:px-6">
  <div class="mx-auto max-w-2xl">
    @if (module(); as m) {
      <a [routerLink]="['/courses', m.courseId]" class="text-sm text-white/50 hover:text-white">← Back</a>
      <h1 class="mt-2 font-display text-2xl text-accent-400">{{ m.title }}</h1>
      @if (m.description) {
        <p class="mt-2 text-white/60">{{ m.description }}</p>
      }

      <div class="mt-6 space-y-3">
        @for (lesson of m.lessons; track lesson.id) {
          <a
            [routerLink]="['/lesson', lesson.id]"
            class="block rounded-xl bg-surface-900 p-5 transition hover:bg-surface-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent-400"
          >
            <h2 class="font-display text-lg font-semibold">{{ lesson.title }}</h2>
          </a>
        }
      </div>
    }
  </div>
</div>

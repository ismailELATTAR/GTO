# Local development compose — this is what `docker compose up` runs by
# default. Hot-reloads both apps via bind mounts; no image build required.
# For the production-style build (multi-stage Dockerfiles, nginx, packaged
# jar), see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pokergto}
      POSTGRES_USER: ${DB_USERNAME:-pokergto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pokergto}
    ports:
      - "5432:5432"
    volumes:
      - pokergto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pokergto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Identity provider — owns user accounts, credentials, and token issuing.
  # Realm/client/roles are declaratively imported from keycloak/realm-export.json
  # on startup, so no manual admin-console setup is needed for local dev.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    image: eclipse-temurin:17-jdk-alpine
    working_dir: /app
    command: sh -c "./mvnw spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pokergto}
      DB_USERNAME: ${DB_USERNAME:-pokergto}
      DB_PASSWORD: ${DB_PASSWORD:-pokergto}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-pokergto}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-pokergto-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-client-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - pokergto_m2:/root/.m2

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - pokergto_node_modules:/app/node_modules

volumes:
  pokergto_pgdata:
  pokergto_m2:
  pokergto_node_modules:
